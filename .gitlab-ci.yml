include:
  - project: 'lamansys/cicd'
    file:
      - 'gitlab/jobs/dockerize.template.yml'

stages:
  - build
  - dockerize
  - deploy

variables:
  IPS_VERSION: "0.2.0"

build:
  image: hl7fhir/ig-publisher-base:latest
  stage: build
  cache:
    key:
      files:
        - sushi-config.yaml
      prefix: fhir-packages
    paths:
      - .cache/fhir-packages/
      - .cache/txcache/
  script:
    - bash ci/build.sh
  artifacts:
    paths:
      - output
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "main"'

dockerize:
  extends: .dockerize_folder
  needs:
    - build
  variables:
    DOCKER_FOLDER: docker
    IMAGE_NAME: mhd
    IMAGE_VERSION: $CI_COMMIT_TAG
    DOCKER_BUILD_ARGS: --build-arg IG_VERSION=$CI_COMMIT_TAG
  before_script:
    - mv output "${DOCKER_FOLDER}/output"
  rules:
    - if: '$CI_COMMIT_TAG'

pages:
  image: alpine:latest
  stage: deploy
  needs:
    - build
  script:
    - rm -rf public
    - mv output public
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
