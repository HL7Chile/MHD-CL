apiVersion: apps/v1
kind: Deployment
metadata:
  name: mhd-app
  namespace: hsi-salud
  labels:
    app: mhd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mhd
  template:
    metadata:
      labels:
        app: mhd
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: nginx
          image: registry.lamansys.ar/interoperabilidad/mhd/mhd:0.2.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mhd-app
  namespace: hsi-salud
  labels:
    app: mhd
spec:
  selector:
    app: mhd
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mhd-tls
  namespace: hsi-salud
spec:
  secretName: mhd-tls
  dnsNames:
    - mhd.ri.hsisalud.org
  issuerRef:
    name: hsi-salud-cert-manager-issuer
    kind: Issuer
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: mhd-gateway
  namespace: hsi-salud
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: eg-gateway
    namespace: envoy-gateway-system
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      hostname: mhd.ri.hsisalud.org
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: mhd-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mhd
  namespace: hsi-salud
spec:
  hostnames:
    - mhd.ri.hsisalud.org
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: mhd-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: mhd-app
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mhd-https-redirect
  namespace: hsi-salud
spec:
  hostnames:
    - mhd.ri.hsisalud.org
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: eg-gateway
      namespace: envoy-gateway-system
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
